<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @layer base {
            html, body {
                width: 100vw;
                margin: 0;
                padding: 0;
                background-color: #0c141f;
                overflow: hidden;
            }
            body {
                overscroll-behavior: none;
            }
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }
            main > :first-child {
                margin-top: 0 !important;
            }
            main > :last-child {
                margin-bottom: 0 !important;
            }
        }
        ::-webkit-scrollbar {
            display: none;
        }
        @media (min-aspect-ratio: 16/9) {
            .landscape-container {
                max-width: 177.78vh;
                margin: 0 auto;
            }
        }
    </style>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#454f5d",
                        "on-secondary-container": "#725f00",
                        "outline-variant": "#4a5b5d",
                        "secondary-container": "#ffdb3c",
                        "error": "#ffb4ab",
                        "on-secondary": "#3a3000",
                        "on-tertiary": "#690003",
                        "surface-variant": "#364150",
                        "on-secondary-fixed-variant": "#544600",
                        "inverse-surface": "#dbe3f4",
                        "surface-container-low": "#1e2837",
                        "on-tertiary-container": "#c1000a",
                        "inverse-on-surface": "#29313e",
                        "primary-container": "#00f0ff",
                        "secondary-fixed": "#ffe16d",
                        "primary-fixed": "#7df4ff",
                        "primary": "#00f0ff",
                        "on-tertiary-fixed-variant": "#930005",
                        "inverse-primary": "#006970",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#410001",
                        "surface-tint": "#00dbe9",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "on-surface-variant": "#d1e1e2",
                        "primary-fixed-dim": "#00dbe9",
                        "surface-container-high": "#323c4b",
                        "on-secondary-fixed": "#221b00",
                        "tertiary-container": "#ffcec7",
                        "tertiary": "#fff3f1",
                        "on-primary": "#000000",
                        "secondary-fixed-dim": "#e9c400",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#002022",
                        "on-background": "#ffffff",
                        "on-error-container": "#ffdad6",
                        "secondary": "#fff9ef",
                        "surface-container": "#252e3b",
                        "surface-dim": "#0c141f",
                        "surface-container-highest": "#3f4b5b",
                        "on-primary-container": "#006970",
                        "on-surface": "#ffffff",
                        "tertiary-fixed": "#ffdad5",
                        "surface-container-lowest": "#0e1826",
                        "background": "#0c141f",
                        "outline": "#94a3a4",
                        "surface": "#0c141f",
                        "on-primary-fixed-variant": "#004f54"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "container-padding": "24px",
                        "touch-target-min": "48px",
                        "section-margin": "32px",
                        "grid-gap": "8px"
                    },
                    fontFamily: {
                        "display-number": ["Sora"],
                        "label-bold": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "display-number-mobile": ["Sora"],
                        "headline-sm": ["Sora"],
                        "headline-lg": ["Sora"]
                    },
                    fontSize: {
                        "display-number": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "800" }],
                        "label-bold": ["16px", { lineHeight: "20px", fontWeight: "800" }],
                        "body-md": ["18px", { lineHeight: "26px", fontWeight: "400" }],
                        "display-number-mobile": ["28px", { lineHeight: "32px", fontWeight: "800" }],
                        "headline-sm": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "headline-lg": ["40px", { lineHeight: "48px", fontWeight: "800" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background font-body-md text-on-surface flex flex-col min-h-screen overflow-hidden">
    <header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-2xl pt-safe shadow-lg">
        <div class="h-16 px-container-padding flex items-center justify-between landscape-container">
            <div class="flex items-center gap-6">
                <button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface hover:text-primary" onclick="console.log('Open Menu')">
                    <span class="material-symbols-outlined text-[32px]">menu</span>
                </button>
                <h1 class="font-headline-sm text-headline-sm uppercase tracking-wider text-white">Keno Game</h1>
            </div>
            <!-- Notification area - left side of the center section -->
            <div class="flex-1 flex items-center justify-start px-4">
                <div id="notification-area" class="hidden flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-label-bold uppercase tracking-wider transition-all duration-300">
                    <span id="notification-icon" class="material-symbols-outlined text-lg">info</span>
                    <span id="notification-text">Notification</span>
                </div>
            </div>
            <!-- Balance - moved to the right -->
            <div class="flex flex-col items-center">
                <div class="flex items-baseline gap-3">
                    <span class="text-lg uppercase font-label-bold text-white/70 tracking-widest">BALANCE</span>
                    <span class="font-display-number-mobile text-[36px] text-primary" id="balance-display">$0</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="w-12 h-12 rounded-full bg-surface-container-high border-2 border-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary text-[28px]">person</span>
                </div>
            </div>
        </div>
    </header>
    <main class="flex-1 flex flex-col pt-16 landscape-container w-full h-full">
        <div class="flex-1 grid grid-cols-12 gap-8 p-container-padding">
            <!-- Left Sidebar -->
            <div class="col-span-2 flex flex-col gap-6">
                <div class="flex flex-col gap-3">
                    <span class="font-headline-sm uppercase text-on-surface tracking-widest px-1 font-bold text-lg">Patterns</span>
                    <div class="flex flex-col gap-3" id="patterns-container">
                        <button class="pattern-btn h-16 flex items-center gap-4 px-4 bg-surface-container-high border border-outline-variant/30 rounded-xl active:scale-95 transition-all hover:bg-surface-container-highest" data-pattern="top" onclick="selectPattern('top')">
                            <span class="material-symbols-outlined text-primary text-xl font-bold">expand_less</span>
                            <span class="font-label-bold text-sm uppercase">Top Half</span>
                        </button>
                        <button class="pattern-btn h-16 flex items-center gap-4 px-4 bg-surface-container-high border border-outline-variant/30 rounded-xl active:scale-95 transition-all hover:bg-surface-container-highest" data-pattern="bottom" onclick="selectPattern('bottom')">
                            <span class="material-symbols-outlined text-primary text-xl font-bold">expand_more</span>
                            <span class="font-label-bold text-sm uppercase">Bottom Half</span>
                        </button>
                        <button class="pattern-btn h-16 flex items-center gap-4 px-4 bg-surface-container-high border border-outline-variant/30 rounded-xl active:scale-95 transition-all hover:bg-surface-container-highest" data-pattern="odd" onclick="selectPattern('odd')">
                            <span class="material-symbols-outlined text-primary text-xl font-bold">filter_1</span>
                            <span class="font-label-bold text-sm uppercase">Odd Numbers</span>
                        </button>
                        <button class="pattern-btn h-16 flex items-center gap-4 px-4 bg-surface-container-high border border-outline-variant/30 rounded-xl active:scale-95 transition-all hover:bg-surface-container-highest" data-pattern="even" onclick="selectPattern('even')">
                            <span class="material-symbols-outlined text-primary text-xl font-bold">filter_2</span>
                            <span class="font-label-bold text-sm uppercase">Even Numbers</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Center: Grid -->
            <div class="col-span-8 flex flex-col gap-4">
                <div class="bg-surface-container p-6 rounded-[2rem] w-full flex flex-col gap-6 shadow-2xl border border-white/5 overflow-y-auto max-h-[80vh]">
                    <!-- Top Half (1-20) -->
                    <div class="grid grid-cols-10 gap-3" id="keno-grid-top"></div>
                    <!-- Horizontal Visual Break -->
                    <div class="h-[4px] w-full bg-outline-variant rounded-full"></div>
                    <!-- Bottom Half (21-40) -->
                    <div class="grid grid-cols-10 gap-3" id="keno-grid-bottom"></div>
                    <!-- Numbers Selected Counter -->
                    <div class="flex items-center justify-center gap-2 pt-2">
                        <div class="h-[2px] flex-1 bg-outline-variant/30 rounded-full"></div>
                        <span class="font-label-bold text-sm uppercase tracking-widest text-on-surface-variant/80 px-4" id="numbers-selected">NUMBERS SELECTED 0</span>
                        <div class="h-[2px] flex-1 bg-outline-variant/30 rounded-full"></div>
                    </div>
                </div>
                <!-- Results Display -->
                <div id="results-area" class="hidden bg-surface-container-highest p-4 rounded-2xl border border-primary/20">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="font-label-bold text-sm uppercase text-on-surface-variant tracking-widest">Drawn Numbers</span>
                            <div class="flex flex-wrap gap-2 mt-2" id="drawn-numbers-display"></div>
                        </div>
                        <div class="text-right">
                            <span class="font-label-bold text-sm uppercase text-on-surface-variant tracking-widest">Result</span>
                            <div id="result-display" class="font-display-number text-2xl mt-1"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Right Sidebar -->
            <div class="col-span-2 flex flex-col gap-8">
                <div class="bg-surface-container-highest p-5 rounded-2xl flex flex-col gap-2 shadow-inner border border-primary/20 relative">
                    <div class="flex flex-col items-start">
                        <button onclick="currentBet = 0; document.getElementById('bet-display').innerText = '0';" class="absolute right-2 w-10 h-10 flex items-center justify-center bg-error rounded-full shadow-lg active:scale-90 transition-transform bottom-2" aria-label="Clear Bet">
                            <span class="material-symbols-outlined text-on-error font-bold">close</span>
                        </button>
                        <span class="font-label-bold text-sm uppercase text-on-surface-variant tracking-widest block mb-1">Current Bet</span>
                        <span class="font-display-number text-[48px] text-primary" id="bet-display">0</span>
                    </div>
                </div>
                <div class="flex flex-col gap-4">
                    <div class="flex items-center justify-between px-1">
                        <span class="font-label-bold text-lg uppercase text-on-surface-variant tracking-widest">Bet Amount</span>
                    </div>
                    <div class="grid grid-cols-1 gap-3">
                        <button class="flex items-center justify-between px-5 h-14 rounded-xl bg-surface-bright text-white border-2 border-transparent hover:border-primary/50 transition-all active:scale-95 group" onclick="addBet(1)">
                            <span class="font-display-number text-2xl group-hover:text-primary transition-colors">1</span>
                            <span class="font-label-bold text-xs uppercase opacity-80">Credit</span>
                        </button>
                        <button class="flex items-center justify-between px-5 h-14 rounded-xl bg-surface-bright text-white border-2 border-transparent hover:border-primary/50 transition-all active:scale-95 group" onclick="addBet(5)">
                            <span class="font-display-number text-2xl group-hover:text-primary transition-colors">5</span>
                            <span class="font-label-bold text-xs uppercase opacity-80">Credits</span>
                        </button>
                        <button class="flex items-center justify-between px-5 h-14 rounded-xl bg-surface-bright text-white border-2 border-transparent hover:border-primary/50 transition-all active:scale-95 group" onclick="addBet(25)">
                            <span class="font-display-number text-2xl group-hover:text-primary transition-colors">25</span>
                            <span class="font-label-bold text-xs uppercase opacity-80">Credits</span>
                        </button>
                        <button class="flex items-center justify-between px-5 h-14 rounded-xl bg-surface-bright text-white border-2 border-transparent hover:border-primary/50 transition-all active:scale-95 group" onclick="addBet(50)">
                            <span class="font-display-number text-2xl group-hover:text-primary transition-colors">50</span>
                            <span class="font-label-bold text-xs uppercase opacity-80">Credits</span>
                        </button>
                    </div>
                </div>
                <!-- Play Button -->
                <button id="play-button" class="w-full h-16 flex items-center justify-center gap-3 px-6 bg-primary text-on-primary font-headline-sm text-xl uppercase tracking-widest rounded-2xl active:scale-95 transition-all hover:brightness-110 shadow-lg shadow-primary/20 disabled:opacity-50 disabled:cursor-not-allowed" onclick="handlePlay()">
                    <span class="material-symbols-outlined text-[32px] font-bold">play_arrow</span>
                    <span>Play</span>
                </button>
            </div>
        </div>
    </main>
    <script>
        const gridTop = document.getElementById('keno-grid-top');
        const gridBottom = document.getElementById('keno-grid-bottom');
        const betDisplay = document.getElementById('bet-display');
        const balanceDisplay = document.getElementById('balance-display');
        const patternsContainer = document.getElementById('patterns-container');
        const resultsArea = document.getElementById('results-area');
        const drawnNumbersDisplay = document.getElementById('drawn-numbers-display');
        const resultDisplay = document.getElementById('result-display');
        const playButton = document.getElementById('play-button');
        const notificationArea = document.getElementById('notification-area');
        const notificationIcon = document.getElementById('notification-icon');
        const notificationText = document.getElementById('notification-text');
        let selectedNumbers = new Set();
        let currentBet = 0;
        let activePattern = null;
        let isPlaying = false;
        let betsLocked = false;

        // Initialize Grid
        for (let i = 1; i <= 40; i++) {
            const cell = document.createElement('button');
            cell.className = 'number-cell aspect-square w-full rounded-xl bg-surface-bright flex items-center justify-center font-display-number text-on-surface transition-all active:scale-90 border-2 border-transparent hover:border-primary/50';
            cell.innerHTML = i;
            cell.dataset.number = i;
            cell.onclick = () => toggleNumber(i);

            if (i <= 20) {
                gridTop.appendChild(cell);
            } else {
                gridBottom.appendChild(cell);
            }
        }

        // ---- Socket.io Connection ----
        const socket = io();

        // Join the keno game room
        socket.emit('join-game', 'keno');

        // Listen for keno state updates
        socket.on('keno-state', (state) => {
            // Update bets locked state
            betsLocked = state.betsLocked;

            // Update play button state
            updatePlayButtonState();

            // Show/hide notification
            if (state.message) {
                showNotification(state.message, state.messageType);
            } else {
                hideNotification();
            }

            // If bets are locked, disable number selection and bet buttons
            if (state.betsLocked) {
                document.querySelectorAll('.number-cell').forEach(cell => {
                    cell.style.cursor = 'not-allowed';
                    cell.classList.add('opacity-60');
                });
                document.querySelectorAll('.pattern-btn').forEach(btn => {
                    btn.style.cursor = 'not-allowed';
                    btn.classList.add('opacity-60');
                });
                // Disable bet amount buttons
                document.querySelectorAll('[onclick^="addBet"]').forEach(btn => {
                    btn.style.cursor = 'not-allowed';
                    btn.classList.add('opacity-60');
                });
            } else {
                document.querySelectorAll('.number-cell').forEach(cell => {
                    cell.style.cursor = 'pointer';
                    cell.classList.remove('opacity-60');
                });
                document.querySelectorAll('.pattern-btn').forEach(btn => {
                    btn.style.cursor = 'pointer';
                    btn.classList.remove('opacity-60');
                });
                document.querySelectorAll('[onclick^="addBet"]').forEach(btn => {
                    btn.style.cursor = 'pointer';
                    btn.classList.remove('opacity-60');
                });
            }
        });

        function showNotification(message, type) {
            notificationArea.classList.remove('hidden');
            notificationText.textContent = message;

            // Set icon and colors based on type
            const iconMap = {
                'info': 'info',
                'warning': 'warning',
                'error': 'error',
                'success': 'check_circle'
            };
            notificationIcon.textContent = iconMap[type] || 'info';

            // Set background color based on type
            notificationArea.classList.remove('bg-primary/20', 'bg-secondary-container/20', 'bg-error/20', 'bg-green-500/20', 'border-primary/30', 'border-secondary-container/30', 'border-error/30', 'border-green-500/30');
            notificationArea.classList.remove('text-primary', 'text-secondary-container', 'text-error', 'text-green-400');

            const colorMap = {
                'info': { bg: 'bg-primary/20', border: 'border-primary/30', text: 'text-primary' },
                'warning': { bg: 'bg-secondary-container/20', border: 'border-secondary-container/30', text: 'text-secondary-container' },
                'error': { bg: 'bg-error/20', border: 'border-error/30', text: 'text-error' },
                'success': { bg: 'bg-green-500/20', border: 'border-green-500/30', text: 'text-green-400' }
            };

            const colors = colorMap[type] || colorMap.info;
            notificationArea.classList.add(colors.bg, colors.border, colors.text);
            notificationArea.classList.add('border');
        }

        function hideNotification() {
            notificationArea.classList.add('hidden');
        }

        function updatePlayButtonState() {
            if (betsLocked) {
                playButton.disabled = true;
                playButton.innerHTML = '<span class="material-symbols-outlined text-[32px] font-bold">lock</span><span>Bets Locked</span>';
            } else if (!isPlaying) {
                playButton.disabled = false;
                playButton.innerHTML = '<span class="material-symbols-outlined text-[32px] font-bold">play_arrow</span><span>Play</span>';
            }
        }

        // Fetch user state on load
        async function fetchUserState() {
            try {
                const res = await fetch('/api/user');
                const data = await res.json();
                if (data.success) {
                    updateBalanceDisplay(data.user.balance);
                }
            } catch (err) {
                console.error('Failed to fetch user state:', err);
            }
        }

        function updateBalanceDisplay(balance) {
            balanceDisplay.innerText = '$' + balance.toLocaleString();
        }

        function updateNumbersSelected() {
            document.getElementById('numbers-selected').innerText = 'NUMBERS SELECTED ' + selectedNumbers.size;
        }

        function toggleNumber(num) {
            if (isPlaying || betsLocked) return; // Lock during play or when bets are locked

            // Rule 2: Deselect any active pattern button when a number is clicked
            clearPatternSelection();

            const cell = document.querySelector(`[data-number="${num}"]`);
            if (selectedNumbers.has(num)) {
                selectedNumbers.delete(num);
                updateCellUI(cell, false);
            } else {
                if (selectedNumbers.size >= 15) return;
                selectedNumbers.add(num);
                updateCellUI(cell, true);
                triggerHaptic();
            }
            updateNumbersSelected();
        }

        function updateCellUI(cell, isSelected) {
            if (isSelected) {
                cell.classList.remove('bg-surface-bright', 'text-on-surface');
                cell.classList.add('bg-primary', 'text-on-primary', 'font-black', 'scale-105', 'shadow-xl', 'border-white');
            } else {
                cell.classList.remove('bg-primary', 'text-on-primary', 'font-black', 'scale-105', 'shadow-xl', 'border-white');
                cell.classList.add('bg-surface-bright', 'text-on-surface');
            }
        }

        function selectPattern(type) {
            if (isPlaying || betsLocked) return; // Lock during play or when bets are locked

            // Rule 1: Clear individual selections and highlight pattern button
            clearSelections();

            // Toggle off if clicking the same active pattern
            if (activePattern === type) {
                activePattern = null;
                clearPatternSelection();
                return;
            }

            activePattern = type;

            // Highlight selected pattern button and deselect others
            document.querySelectorAll('.pattern-btn').forEach(btn => {
                if (btn.dataset.pattern === type) {
                    btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                    btn.classList.remove('bg-surface-container-high', 'text-on-surface');
                    // Adjust icons and labels within pattern button
                    btn.querySelector('.material-symbols-outlined').classList.remove('text-primary');
                    btn.querySelector('.material-symbols-outlined').classList.add('text-on-primary');
                } else {
                    btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    btn.classList.add('bg-surface-container-high', 'text-on-surface');
                    btn.querySelector('.material-symbols-outlined').classList.add('text-primary');
                    btn.querySelector('.material-symbols-outlined').classList.remove('text-on-primary');
                }
            });

            // Apply pattern selection
            const numbers = [];
            for (let i = 1; i <= 40; i++) {
                let shouldSelect = false;
                if (type === 'top') shouldSelect = i <= 20;
                else if (type === 'bottom') shouldSelect = i > 20;
                else if (type === 'odd') shouldSelect = i % 2 === 1;
                else if (type === 'even') shouldSelect = i % 2 === 0;

                if (shouldSelect && selectedNumbers.size < 15) {
                    numbers.push(i);
                    selectedNumbers.add(i);
                    const cell = document.querySelector(`[data-number="${i}"]`);
                    updateCellUI(cell, true);
                }
            }
            updateNumbersSelected();
            triggerHaptic();
        }

        function clearPatternSelection() {
            activePattern = null;
            document.querySelectorAll('.pattern-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.add('bg-surface-container-high', 'text-on-surface');
                const icon = btn.querySelector('.material-symbols-outlined');
                icon.classList.add('text-primary');
                icon.classList.remove('text-on-primary');
            });
        }

        function addBet(amount) {
            if (isPlaying || betsLocked) return;
            currentBet += amount;
            betDisplay.innerText = currentBet;
            triggerHaptic();
        }

        function clearSelections() {
            selectedNumbers.clear();
            document.querySelectorAll('.number-cell').forEach(c => updateCellUI(c, false));
            updateNumbersSelected();
        }

        function triggerHaptic() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(15);
            }
        }

        // --- Game Play ---
        async function handlePlay() {
            if (isPlaying || betsLocked) return;

            // Validate selections
            if (selectedNumbers.size === 0) {
                showResult('Select numbers first!', false);
                return;
            }
            if (currentBet <= 0) {
                showResult('Place a bet first!', false);
                return;
            }

            isPlaying = true;
            playButton.disabled = true;
            playButton.innerHTML = '<span class="material-symbols-outlined text-[32px] font-bold animate-spin">refresh</span><span>Drawing...</span>';

            // Hide previous results
            resultsArea.classList.add('hidden');

            try {
                const res = await fetch('/api/keno/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        picks: Array.from(selectedNumbers),
                        bet: currentBet
                    })
                });

                const data = await res.json();

                if (!data.success) {
                    showResult(data.error || 'Error playing', false);
                    isPlaying = false;
                    playButton.disabled = false;
                    playButton.innerHTML = '<span class="material-symbols-outlined text-[32px] font-bold">play_arrow</span><span>Play</span>';
                    return;
                }

                const result = data.result;

                // Update balance
                updateBalanceDisplay(result.newBalance);

                // Show results
                displayResults(result);

                // Highlight drawn numbers on grid
                highlightDrawnNumbers(result.drawn, Array.from(selectedNumbers));

                // Show win/loss message
                if (result.isWin) {
                    showResult(`WIN! ${result.winAmount} credits (${result.matches} matches)`, true);
                    triggerConfetti();
                } else {
                    showResult(`No win. ${result.matches} matches. Try again!`, false);
                }

            } catch (err) {
                showResult('Network error. Try again.', false);
                console.error(err);
            }

            isPlaying = false;
            playButton.disabled = false;
            playButton.innerHTML = '<span class="material-symbols-outlined text-[32px] font-bold">play_arrow</span><span>Play</span>';
        }

        function displayResults(result) {
            // Show drawn numbers
            drawnNumbersDisplay.innerHTML = '';
            result.drawn.forEach(num => {
                const chip = document.createElement('span');
                chip.className = 'inline-flex items-center justify-center w-10 h-10 rounded-full bg-surface-bright text-on-surface font-display-number text-sm border border-outline-variant/30';
                chip.textContent = num;
                drawnNumbersDisplay.appendChild(chip);
            });

            // Show result summary
            const matches = result.matches;
            const winAmount = result.winAmount;
            const netChange = result.netChange;

            if (result.isWin) {
                resultDisplay.innerHTML = `
                    <div class="text-secondary-container font-bold">+${winAmount}</div>
                    <div class="text-sm text-on-surface-variant">${matches} matches</div>
                `;
            } else {
                resultDisplay.innerHTML = `
                    <div class="text-error font-bold">${netChange}</div>
                    <div class="text-sm text-on-surface-variant">${matches} matches</div>
                `;
            }

            resultsArea.classList.remove('hidden');
        }

        function highlightDrawnNumbers(drawn, picks) {
            const drawnSet = new Set(drawn);
            const picksSet = new Set(picks);

            document.querySelectorAll('.number-cell').forEach(cell => {
                const num = parseInt(cell.dataset.number);

                // Reset to default first
                cell.classList.remove('bg-primary', 'text-on-primary', 'font-black', 'scale-105', 'shadow-xl', 'border-white');
                cell.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'border-secondary-container');
                cell.classList.remove('bg-surface-bright', 'text-on-surface');

                if (drawnSet.has(num) && picksSet.has(num)) {
                    // Match! Gold highlight
                    cell.classList.add('bg-secondary-container', 'text-on-secondary-container', 'font-black', 'scale-105', 'shadow-xl', 'border-secondary-container');
                } else if (drawnSet.has(num)) {
                    // Drawn but not picked - subtle highlight
                    cell.classList.add('bg-surface-bright', 'text-on-surface', 'border-primary/30');
                } else if (picksSet.has(num)) {
                    // Picked but not drawn
                    cell.classList.add('bg-primary/50', 'text-on-primary', 'font-black');
                } else {
                    // Not involved
                    cell.classList.add('bg-surface-bright', 'text-on-surface');
                }
            });
        }

        function showResult(msg, isSuccess) {
            resultDisplay.innerHTML = `<div class="${isSuccess ? 'text-secondary-container' : 'text-error'} font-bold text-lg">${msg}</div>`;
            resultsArea.classList.remove('hidden');
        }

        function triggerConfetti() {
            if (window.confetti) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00f0ff', '#ffdb3c', '#ffffff']
                });
            }
        }

        // Load user state on page load
        fetchUserState();

        // ---- Exit Guard ----
        function handleExit() {
            // Check if there's an active game in progress
            if (isPlaying) {
                if (!confirm('A game is in progress! If you leave now, you will lose your bet. Are you sure?')) {
                    return;
                }
            } else if (currentBet > 0 || selectedNumbers.size > 0) {
                if (!confirm('You have selections or a bet placed. Are you sure you want to leave?')) {
                    return;
                }
            }
            window.location.href = 'index.html';
        }
    </script>
    <style>
        .number-cell {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            min-height: 56px;
        }
        .pattern-btn {
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        #notification-area {
            transition: all 0.3s ease;
        }
    </style>
</body>
</html>
