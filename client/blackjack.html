<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Casino">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Blackjack - Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle, #1a4d2e 0%, #0d2818 100%);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 70px;
        }
        .header-left h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffdb3c;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .player-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .player-name {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }
        .player-balance {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #00f0ff;
        }
        .nav-home-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 13px;
        }
        .nav-home-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Main Game Area */
        main {
            flex: 1;
            display: flex;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        /* Game Board layout (Left: Cards, Right: Controls) */
        .board-container {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-around;
        }

        /* Left Side: Cards Area */
        .cards-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 50%;
        }
        .cards-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
        }
        .cards-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 180px;
        }
        .card-img {
            width: 120px;
            height: 174px;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            margin-left: -50px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: white;
        }
        .card-img:first-child {
            margin-left: 0;
        }
        .card-img:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.7);
        }

        /* Right Side: Stats & Betting Area */
        .controls-area {
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .score-display {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 15px;
        }
        .btn-game {
            width: 100%;
            padding: 15px;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
            background: #000000;
            border: 2px solid #333333;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }
        .btn-game:hover:not(:disabled) {
            background: #222222;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            border-color: #555555;
        }
        .btn-game:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-game:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: #111111;
            border-color: #222222;
        }

        .bet-info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        .clear-bet-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ff3b30;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            transition: all 0.2s;
        }
        .clear-bet-btn:hover:not(:disabled) {
            background: #ff453a;
            transform: scale(1.1);
        }
        .clear-bet-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Chips Container */
        .chips-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        .chip {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px dashed #ffffff;
            background: #000000;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }
        .chip:hover:not(:disabled) {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
            border-color: #ffdb3c;
        }
        .chip:active:not(:disabled) {
            transform: scale(1.0);
        }
        .chip:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Bottom Control Bar (JOIN / LEAVE) */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            height: 90px;
            align-items: center;
        }
        .bottom-btn {
            width: 180px;
            padding: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            border: 2px solid #333333;
            background: #000000;
            color: white;
            text-align: center;
        }
        .bottom-btn:hover:not(:disabled) {
            background: #222222;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            border-color: #555555;
        }
        .bottom-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Overlays & Modals */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 40, 24, 0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            padding: 40px;
        }
        .overlay-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #ffdb3c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .overlay-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 400px;
            line-height: 1.5;
        }
        .overlay-loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ffdb3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Registration Overlay */
        .register-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 17, 30, 0.9);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: #1e2837;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .register-card h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .register-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #00f0ff;
        }
        .form-error {
            color: #ffb4ab;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            min-height: 18px;
        }
        .register-btn {
            width: 100%;
            background: #00f0ff;
            color: #000000;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 16px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .register-btn:hover {
            background: #00dbe9;
            transform: translateY(-2px);
        }

        /* Busted Frozen Screen Styling */
        .busted-overlay {
            background: rgba(80, 0, 5, 0.95);
            border: 5px solid #ff3b30;
            border-radius: 20px;
        }

        /* Floating Notifications/Toasts */
        .toast-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        .toast {
            background: rgba(0, 0, 0, 0.9);
            border-left: 5px solid #ffdb3c;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast-content {
            font-size: 14px;
            font-weight: 600;
        }
        .toast.error { border-color: #ff3b30; }
        .toast.success { border-color: #34c759; }
        .toast.warning { border-color: #ff9500; }
    </style>
</head>
<body>
    <!-- Registration Overlay -->
    <div class="register-overlay" id="register-overlay" style="display: none;">
        <div class="register-card">
            <h1>Welcome</h1>
            <p class="register-subtitle">Please enter your details to get started</p>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Your Name</label>
                    <input type="text" id="username" name="username" placeholder="Enter your name" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="unit_number">Unit Number</label>
                    <input type="text" id="unit_number" name="unit_number" placeholder="Enter your unit number" required autocomplete="off">
                </div>
                <div class="form-error" id="register-error"></div>
                <button type="submit" class="register-btn" id="register-btn">Continue</button>
            </form>
        </div>
    </div>

    <!-- Top Header -->
    <header>
        <div class="header-left">
            <h1>BLACKJACK</h1>
        </div>
        <div class="header-right">
            <div class="player-info">
                <span class="player-name" id="display-name">Player</span>
                <span class="player-balance" id="display-balance">$0</span>
            </div>
            <a href="index.html" class="nav-home-btn" id="exit-top-btn" onclick="return handleLeaveClick(event)">Main Menu</a>
        </div>
    </header>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Main Game Board -->
    <main>
        <!-- Overlay for Waiting States -->
        <div class="overlay" id="state-overlay" style="display: none;">
            <div class="overlay-loader" id="overlay-spinner"></div>
            <h2 class="overlay-title" id="overlay-title">Waiting</h2>
            <p class="overlay-desc" id="overlay-desc">Please wait for the dealer...</p>
        </div>

        <div class="board-container">
            <!-- Left Side: Card display -->
            <div class="cards-area">
                <div class="cards-title" id="deck-owner-label">Your Cards</div>
                <div class="cards-wrapper" id="player-cards-container">
                    <!-- Cards will be dynamically added here -->
                    <div style="color: rgba(255,255,255,0.2); font-size: 15px; font-weight: 600; text-transform: uppercase; border: 2px dashed rgba(255,255,255,0.1); padding: 40px; border-radius: 12px; width: 100%; text-align: center;">
                        No Cards Dealt
                    </div>
                </div>
            </div>

            <!-- Right Side: Controls and bets -->
            <div class="controls-area">
                <div class="score-display" id="player-score-display">Score: 0</div>
                
                <div class="action-buttons">
                    <button class="btn-game" id="btn-hit" onclick="onHitClick()" disabled>HIT</button>
                    <button class="btn-game" id="btn-stand" onclick="onStandClick()" disabled>STAND</button>
                </div>

                <div class="bet-info-row">
                    <span>Current Bet :</span>
                    <span id="bet-amount-display" style="color: #ffdb3c; font-weight: 900; margin-left: 5px;">0</span>
                    <button class="clear-bet-btn" id="btn-clear-bet" onclick="onClearBetClick()" disabled>X</button>
                </div>

                <!-- Dotted Poker Chips -->
                <div class="chips-container">
                    <button class="chip" id="chip-1" onclick="onAddBetClick(1)" disabled>1</button>
                    <button class="chip" id="chip-5" onclick="onAddBetClick(5)" disabled>5</button>
                    <button class="chip" id="chip-10" onclick="onAddBetClick(10)" disabled>10</button>
                    <button class="chip" id="chip-25" onclick="onAddBetClick(25)" disabled>25</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Controls (JOIN / LEAVE) -->
    <div class="bottom-bar">
        <button class="bottom-btn" id="btn-join" onclick="onJoinClick()">JOIN</button>
        <button class="bottom-btn" id="btn-leave" onclick="onLeaveClick()" disabled>LEAVE</button>
    </div>

    <script>
        let socket;
        let userId = null;
        let username = '';
        let balance = 0;
        let currentBet = 0;
        let joined = false;
        let gamePhase = 'LOBBY';
        let myState = null; // Our player object in the player list

        // Fetch User and check registration
        function initApp() {
            fetch('/api/user')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        if (data.user.isRegistered) {
                            userId = data.user.id;
                            username = data.user.username;
                            balance = data.user.balance;
                            updateHeader();
                            initSocket();
                        } else {
                            document.getElementById('register-overlay').style.display = 'flex';
                        }
                    }
                })
                .catch(err => {
                    console.error('Failed to get user profile', err);
                    showToast('Failed to connect to server.', 'error');
                });
        }

        // Handle registration form
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const errDiv = document.getElementById('register-error');
            const btn = document.getElementById('register-btn');
            errDiv.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const userVal = document.getElementById('username').value.trim();
            const unitVal = document.getElementById('unit_number').value.trim();

            if (!userVal || !unitVal) {
                errDiv.textContent = 'Both fields are required.';
                btn.disabled = false;
                btn.textContent = 'Continue';
                return;
            }

            fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: userVal, unit_number: unitVal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    userId = data.user.id;
                    username = data.user.username;
                    balance = data.user.balance;
                    updateHeader();
                    document.getElementById('register-overlay').style.display = 'none';
                    initSocket();
                } else {
                    errDiv.textContent = data.error || 'Failed to register.';
                    btn.disabled = false;
                    btn.textContent = 'Continue';
                }
            })
            .catch(err => {
                errDiv.textContent = 'Network error. Try again.';
                btn.disabled = false;
                btn.textContent = 'Continue';
            });
        });

        // Initialize socket communication
        function initSocket() {
            const urlParams = new URLSearchParams(window.location.search);
            const testUser = urlParams.get('test_user');
            
            socket = io({
                query: testUser ? { test_user: testUser } : {}
            });

            // Join the socket game
            socket.emit('join-game', 'blackjack');

            socket.on('connect', () => {
                console.log('Connected to socket server');
            });

            // Main state updates
            socket.on('blackjack-state', (gameState) => {
                handleStateUpdate(gameState);
            });

            socket.on('blackjack-join-success', (data) => {
                joined = true;
                showToast(data.msg || 'Joined blackjack table!', 'success');
            });

            socket.on('blackjack-join-rejected', (msg) => {
                joined = false;
                showToast(msg || 'Request to join rejected.', 'error');
                hideOverlay();
            });

            socket.on('blackjack-join-error', (msg) => {
                joined = false;
                showToast(msg, 'error');
                hideOverlay();
            });

            socket.on('blackjack-notification', (data) => {
                showToast(data.message, data.type || 'info');
            });

            socket.on('blackjack-error', (msg) => {
                showToast(msg, 'error');
            });
        }

        function updateHeader() {
            document.getElementById('display-name').textContent = username;
            document.getElementById('display-balance').textContent = '$' + balance.toLocaleString();
        }

        // Handle states
        function handleStateUpdate(state) {
            gamePhase = state.phase;
            
            // Find ourselves in the players list
            myState = state.players.find(p => p.id === userId);
            
            // Find ourselves in the pending join requests list
            const isPendingApproval = state.joinRequests.some(r => r.id === userId);

            // Update balance dynamically if we exist and it changed
            fetch('/api/user')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        balance = data.user.balance;
                        updateHeader();
                    }
                });

            // Overlay states
            if (isPendingApproval) {
                showOverlay('Waiting Approval', 'Your request is pending. Waiting for dealer approval...', true);
                disableGameplayUI();
                setBettingControls(false);
                document.getElementById('btn-join').disabled = true;
                document.getElementById('btn-leave').disabled = false;
                return;
            }

            if (!myState) {
                // Not in game
                joined = false;
                currentBet = 0;
                document.getElementById('bet-amount-display').textContent = '0';
                
                // If game in progress, we can't join
                if (state.phase !== 'LOBBY') {
                    showOverlay('Game In Progress', 'A game is currently being played. You can request to join for the next round.', false);
                    document.getElementById('btn-join').disabled = true;
                } else {
                    hideOverlay();
                    document.getElementById('btn-join').disabled = false;
                }

                document.getElementById('btn-leave').disabled = true;
                disableGameplayUI();
                setBettingControls(false);
                clearCardsContainer();
                return;
            }

            // We are joined!
            joined = true;
            hideOverlay();
            document.getElementById('btn-join').disabled = true;
            document.getElementById('btn-leave').disabled = false;

            // Render our bet
            currentBet = myState.bet;
            document.getElementById('bet-amount-display').textContent = currentBet;

            // Render our cards
            renderCards(myState.cards);
            document.getElementById('player-score-display').textContent = `Score: ${myState.score}`;

            // Phase and status handlers
            if (state.phase === 'LOBBY') {
                // We are in lobby, we can place bets and clear bets
                setBettingControls(true);
                disableGameplayUI();
                
                if (myState.bet === 0) {
                    showToastOnce('Place a bet using the chips to participate in the upcoming round!');
                }
            } else if (state.phase === 'PLAYING') {
                setBettingControls(false); // Can't change bet during game

                if (myState.status === 'PLAYING') {
                    // It is our turn!
                    if (state.activeAction === 'wants_hit') {
                        showOverlay('Dealing...', 'Waiting for the dealer to click the deck and deal...', true);
                        disableGameplayUI();
                    } else {
                        hideOverlay();
                        enableGameplayUI();
                    }
                } else if (myState.status === 'WAITING') {
                    showOverlay('Waiting Turn', 'Waiting for other players to complete their turns...', false);
                    disableGameplayUI();
                } else if (myState.status === 'STOOD') {
                    showOverlay('Stood', `You stood on ${myState.score}. Waiting for round to finish.`, false);
                    disableGameplayUI();
                } else if (myState.status === 'BLACKJACK') {
                    showOverlay('Blackjack!', `Natural 21! Hand stands automatically.`, false);
                    disableGameplayUI();
                } else if (myState.status === 'BUSTED') {
                    showOverlay('BUSTED', `You went over 21! Screen frozen until the next game.`, false, true);
                    disableGameplayUI();
                }
            } else if (state.phase === 'DEALER_TURN') {
                setBettingControls(false);
                disableGameplayUI();
                
                if (myState.status === 'BUSTED') {
                    showOverlay('BUSTED', `You went over 21! Screen frozen until the next game.`, false, true);
                } else {
                    showOverlay("Dealer's Turn", `Dealer is playing their hand. Rules: dealer stands on 17+.`, false);
                }
            } else if (state.phase === 'RESOLVED') {
                setBettingControls(false);
                disableGameplayUI();

                // Highlight outcomes
                let outcomeText = '';
                let isBusted = myState.status === 'BUSTED';

                if (myState.status.includes('WIN')) {
                    outcomeText = `YOU WON! Hand status: ${myState.status}`;
                } else if (myState.status.includes('PUSH')) {
                    outcomeText = `PUSH (TIE). Bet returned.`;
                } else if (myState.status.includes('LOSE') || isBusted) {
                    outcomeText = isBusted ? `BUSTED (LOST)` : `DEALER WINS (LOST)`;
                } else {
                    outcomeText = `Round Finished! Status: ${myState.status}`;
                }

                showOverlay('Round Over', outcomeText, false, isBusted);
            }
        }

        // Cards display rendering
        function renderCards(cards) {
            const container = document.getElementById('player-cards-container');
            container.innerHTML = '';
            
            if (!cards || cards.length === 0) {
                container.innerHTML = `<div style="color: rgba(255,255,255,0.2); font-size: 15px; font-weight: 600; text-transform: uppercase; border: 2px dashed rgba(255,255,255,0.1); padding: 40px; border-radius: 12px; width: 100%; text-align: center;">No Cards Dealt</div>`;
                return;
            }

            cards.forEach(cardCode => {
                const img = document.createElement('img');
                img.className = 'card-img';
                img.src = `/assets/cards/${cardCode}.svg`;
                img.alt = cardCode;
                container.appendChild(img);
            });
        }

        function clearCardsContainer() {
            renderCards([]);
            document.getElementById('player-score-display').textContent = 'Score: 0';
        }

        // Overlay handlers
        function showOverlay(title, desc, showLoader = false, isBusted = false) {
            const overlay = document.getElementById('state-overlay');
            const titleEl = document.getElementById('overlay-title');
            const descEl = document.getElementById('overlay-desc');
            const loaderEl = document.getElementById('overlay-spinner');

            titleEl.textContent = title;
            descEl.textContent = desc;
            loaderEl.style.display = showLoader ? 'block' : 'none';
            
            if (isBusted) {
                overlay.className = 'overlay busted-overlay';
            } else {
                overlay.className = 'overlay';
            }

            overlay.style.display = 'flex';
        }

        function hideOverlay() {
            document.getElementById('state-overlay').style.display = 'none';
        }

        // UI toggles
        function setBettingControls(enabled) {
            const chips = document.querySelectorAll('.chip');
            chips.forEach(c => c.disabled = !enabled);
            document.getElementById('btn-clear-bet').disabled = !enabled || currentBet === 0;
        }

        function enableGameplayUI() {
            document.getElementById('btn-hit').disabled = false;
            document.getElementById('btn-stand').disabled = false;
        }

        function disableGameplayUI() {
            document.getElementById('btn-hit').disabled = true;
            document.getElementById('btn-stand').disabled = true;
        }

        // Action Click Triggers
        function onJoinClick() {
            socket.emit('blackjack-join-request');
            showOverlay('Sending Request', 'Sending request to join. Waiting for dealer to approve...', true);
        }

        function onLeaveClick() {
            const confirmMsg = gamePhase === 'PLAYING' || gamePhase === 'DEALER_TURN' 
                ? 'Are you sure you want to leave? If you leave during active play, you will lose your bet!'
                : 'Are you sure you want to leave the blackjack table?';

            if (confirm(confirmMsg)) {
                socket.emit('blackjack-leave');
                joined = false;
                myState = null;
                hideOverlay();
            }
        }

        function handleLeaveClick(e) {
            if (joined) {
                const confirmMsg = gamePhase === 'PLAYING' || gamePhase === 'DEALER_TURN' 
                    ? 'Are you sure you want to leave? If you leave during active play, you will lose your bet!'
                    : 'Are you sure you want to leave the blackjack table?';

                if (!confirm(confirmMsg)) {
                    e.preventDefault();
                    return false;
                }
                socket.emit('blackjack-leave');
            }
            return true;
        }

        function onAddBetClick(amount) {
            const nextBet = currentBet + amount;
            if (nextBet > balance) {
                showToast('Insufficient balance to bet that amount!', 'error');
                return;
            }
            socket.emit('blackjack-bet-update', { bet: nextBet });
        }

        function onClearBetClick() {
            socket.emit('blackjack-clear-bet');
        }

        function onHitClick() {
            socket.emit('blackjack-hit');
            disableGameplayUI(); // Disable till dealer deals
        }

        function onStandClick() {
            socket.emit('blackjack-stand');
            disableGameplayUI();
        }

        // Toast Messages
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            toast.innerHTML = `
                <span class="toast-content">${message}</span>
                <span style="cursor:pointer; margin-left: 15px; font-weight: bold;" onclick="this.parentElement.remove()">×</span>
            `;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Auto dismiss after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        let lastShownToastMsg = '';
        function showToastOnce(msg) {
            if (lastShownToastMsg === msg) return;
            lastShownToastMsg = msg;
            showToast(msg);
            setTimeout(() => { lastShownToastMsg = ''; }, 6000);
        }

        // Start
        initApp();
    </script>
    <script src="fullscreen.js"></script>
</body>
</html>
